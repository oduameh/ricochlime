name: Build for iOS

# Using instructions from
# https://docs.flutter.dev/deployment/ios#create-a-build-archive-with-codemagic-cli-tools

on:
  # Enable manual run
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    outputs:
      buildName: ${{ steps.get_version.outputs.buildName }}
      buildNumber: ${{ steps.get_version.outputs.buildNumber }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          # get buildName from pubspec.yaml (before the +)
          buildName=$(grep -oP '(?<=version: ).*(?=\+)' pubspec.yaml)
          echo "buildName=$buildName" >> $GITHUB_OUTPUT

          # get buildNumber from pubspec.yaml (after the +)
          buildNumber=$(grep -oP '(?<=version: ).*' pubspec.yaml | grep -oP '(?<=\+).*$')
          echo "buildNumber=$buildNumber" >> $GITHUB_OUTPUT

  # Unsigned simulator build: verifies the iOS build compiles on every push.
  # The resulting Runner.app only runs on the iOS Simulator,
  # NOT on a physical iPhone (that requires Apple Developer signing,
  # see the build-ios job below).
  build-ios-simulator:
    name: Build for iOS Simulator (unsigned)
    runs-on: macos-latest
    needs: get-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          cache-flutter: false
          cache-pub: false
          no-save-caches: true

      - run: flutter pub get

      - name: Build for the iOS Simulator
        id: build
        run: |
          flutter build ios --no-pub --simulator

          export appPath="Ricochlime_v${{ needs.get-version.outputs.buildName }}_simulator.app"
          mv build/ios/iphonesimulator/Runner.app "$appPath"
          echo "appPath=$appPath" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ricochlime-iOS-Simulator
          path: ${{ steps.build.outputs.appPath }}

  build-ios:
    name: Build for iOS
    runs-on: macos-latest
    needs: get-version
    # Signed builds need Apple Developer secrets,
    # so only run them on version tags.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{secrets.APP_STORE_CONNECT_ISSUER_ID}}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{secrets.APP_STORE_CONNECT_KEY_IDENTIFIER}}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{secrets.APP_STORE_CONNECT_PRIVATE_KEY}}
      APP_STORE_CERTIFICATE_KEY: ${{secrets.APP_STORE_CERTIFICATE_KEY}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Xcode
        run: |
          echo "Selecting Xcode 26.1..."
          sudo xcode-select -s /Applications/Xcode_26.1.app
          xcode-select -p
          echo

          echo "Running Xcode first launch..."
          xcodebuild -runFirstLaunch
          echo

          echo "Downloading iOS platform files..."
          xcodebuild -downloadPlatform iOS -version 26.1
          echo

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter
          cache-flutter: false
          cache-pub: false
          no-save-caches: true

      - name: Install Codemagic CLI Tools
        run: pipx install codemagic-cli-tools

      - name: Setup keychain
        run: |
          keychain initialize

          app-store-connect fetch-signing-files com.oduameh.ricochlime \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CERTIFICATE_KEY \
            --create

          keychain add-certificates

          xcode-project use-profiles --project ios/*.xcodeproj

      - run: flutter pub get

      - name: Build for iOS
        id: build
        run: |
          flutter build ipa --no-pub \
            --export-options-plist=$HOME/export_options.plist

          export ipaPath="Ricochlime_v${{ needs.get-version.outputs.buildName }}.ipa"
          mv "$(find $(pwd) -name "*.ipa")" "$ipaPath"
          echo "ipaPath=$ipaPath" >> $GITHUB_OUTPUT

      - name: Restore keychain
        run: |
          keychain use-login

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ricochlime-iOS-Archive
          path: ${{ steps.build.outputs.ipaPath }}

      - name: Publish to App Store
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: app-store-connect publish --path ${{ steps.build.outputs.ipaPath }}
